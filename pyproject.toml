[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescomp"
version = "0.1.0"
description = "Compress residual-stream activations and store them with the metadata interpretability work needs"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "numpy>=1.24", "zstandard>=0.21", "pyarrow>=15", "torchao>=0.18"]

[project.optional-dependencies]
hf = ["transformers>=4.56"]                       # 4.56: from_pretrained(dtype=)
scripts = ["transformers>=4.56", "datasets>=2.18"]   # scripts/: the study, the CLI and the wikitext corpus
test = ["pytest>=7", "pytest-cov", "ruff", "transformers>=4.56", "moto[server]>=5", "boto3"]

[tool.setuptools.packages.find]
include = ["rescomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150                 # the code keeps one idea per line with a trailing comment; wrapping would not help
extend-exclude = ["results", "dumps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731", "E741", "SIM108", "SIM115", "SIM117", "B007", "B905", "UP032"]
# long lines, lambdas, `l` for a layer, ternaries, open() in scripts, nested with, unused loop vars, zip strictness, f-string nagging

[tool.ruff.lint.isort]
known-first-party = ["rescomp"]
